caption: Control default HTTPS upgrade behavior through Brave Shields
desc: |-
  This policy determines how Brave handles HTTP to HTTPS upgrades to improve connection security.

  If this policy is set to 1 (Disabled), HTTP connections are allowed without attempting upgrades to HTTPS.

  If this policy is set to 2 (Strict), HTTPS connections are required.

  If this policy is set to 3 (Standard), HTTP is upgraded to HTTPS when available.

  If left unset, Brave uses the standard mode where HTTP is upgraded to HTTPS when available, but users can modify this setting through Brave Shields.
default: null
example_value: 3
features:
  can_be_mandatory: true
  can_be_recommended: false
  dynamic_refresh: true
  per_profile: true
items:
- caption: Allow HTTP
  name: Disabled
  value: 1
- caption: Require HTTPS
  name: Strict
  value: 2
- caption: Prefer HTTPS
  name: Standard
  value: 3
