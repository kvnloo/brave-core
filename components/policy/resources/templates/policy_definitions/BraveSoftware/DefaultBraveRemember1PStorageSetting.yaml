caption: Control default first-party storage retention behavior through Brave Shields
desc: |-
  This policy determines whether Brave remembers or forgets first-party storage data when users close tabs or navigate away.

  If this policy is set to 1 (RememberFirstPartyStorage), first-party storage data is preserved across browser sessions.

  If this policy is set to 2 (ForgetFirstPartyStorage), first-party storage data is cleared when tabs are closed or users navigate away.

  If left unset, Brave uses the default storage behavior, but users can modify this setting through Brave Shields.
default: null
example_value: 1
features:
  can_be_mandatory: true
  can_be_recommended: false
  dynamic_refresh: true
  per_profile: true
items:
- caption: Remember first-party storage data
  name: RememberFirstPartyStorage
  value: 1
- caption: Forget first-party storage data
  name: ForgetFirstPartyStorage
  value: 2
